# Minimal SingleBinary overlay for Grafana's unified `loki` chart (7.3.0 / Loki 3.6.12).
#
# IMPORTANT: values MUST nest under `loki:` — that is the Helm DEPENDENCY name in
# Chart.yaml. The `loki` chart ALSO has its own inner `loki:` config block, so the
# Loki server config lives at `loki.loki.*` (two levels). This mirrors the trap
# documented in longhorn-system/values.yaml: values under the wrong top-level key
# are silently inert.
#
# MIGRATION CONTEXT: replaces the deprecated loki-distributed microservices install.
# That install used emptyDir (no PVCs) so all logs were already ephemeral, and
# nothing shipped logs to it (alloy is a metrics-only agent). This is therefore a
# clean fresh start: SingleBinary + a durable Longhorn PVC + tsdb/v13 schema.
loki:
  # One monolithic StatefulSet instead of the distributed read/write/backend split.
  deploymentMode: SingleBinary

  # Loki server config. The chart auto-populates storage paths from `storage.type`.
  loki:
    # Single-tenant homelab; matches the previous install (auth_enabled was false).
    auth_enabled: false
    commonConfig:
      # Single replica -> replication factor must be 1 (chart default is 3).
      replication_factor: 1
    # Filesystem storage (chunks + boltdb/tsdb index on the PVC), no object store.
    storage:
      type: filesystem
    # Loki 3.x wants tsdb + schema v13. No historical data to preserve (old store
    # was ephemeral), so a single period from a past day boundary is sufficient.
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    # Keep resource use sane on the arm64 RPi nodes.
    limits_config:
      # 30 days. Alloy now ships every pod log on all four nodes (see
      # apps/alloy/values.yaml), so this store is no longer idle.
      #
      # `retention_period` alone does nothing. The compactor applies it, and it
      # needs `retention_enabled: true` below. Without that flag the compactor
      # only compacts tables and keeps every chunk forever.
      retention_period: 720h

    # The compactor already runs inside the SingleBinary `all` target, so this
    # only configures it. Confirmed live: /compactor/ring returns 200 and the
    # pod writes compactor-*.tsdb.gz index files.
    compactor:
      # Turns `retention_period` above into actual deletes.
      retention_enabled: true
      # Required in Loki 3.x when retention is on. Storage is filesystem here,
      # not an object store.
      delete_request_store: filesystem
      working_directory: /var/loki/data/retention
      compaction_interval: 10m
      # Grace period between marking a chunk for deletion and deleting it. Leaves
      # room to raise the retention period without having already lost the data.
      retention_delete_delay: 2h

  # The single monolithic pod, backed by a durable Longhorn volume (was emptyDir).
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: longhorn
      size: 10Gi

  # Explicitly zero the SimpleScalable targets so nothing from the default topology
  # renders alongside SingleBinary.
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  # nginx front door -> stable `loki-gateway` Service (port 80) that both the
  # Grafana datasource and the loki.cikli.com HTTPRoute point at.
  gateway:
    enabled: true

  # Disable the heavy/default-on extras unsuitable for a small homelab:
  #  - chunks/results caches are memcached pods requesting GBs of RAM
  #  - the canary continuously writes probe logs (needs a push target)
  #  - the helm test pod is only for CI
  # Loki had no ServiceMonitor and no Prometheus targets at all, so ingest rate,
  # write errors and whether retention actually deletes were all invisible.
  # Prometheus selects all ServiceMonitors, so enabling this is enough.
  #
  # The chart also gates this template on
  # `Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor"`.
  # Plain `helm template` renders nothing, because it has no cluster
  # capabilities. Argo CD passes the cluster's API versions, so it does render.
  # To check the template locally, add:
  #   --api-versions monitoring.coreos.com/v1/ServiceMonitor
  monitoring:
    serviceMonitor:
      enabled: true

  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false

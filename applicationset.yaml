apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # The name is `grafana` for history only. This object was created for Grafana
  # alone, then grew to cover every app. `kubectl apply` must update it in place.
  #
  # Do not rename it by deleting this object and creating a new one until
  # `preserveResourcesOnDeletion` below is live in the cluster. Deleting an
  # ApplicationSet without that flag cascades to every Application it owns, and
  # then to Longhorn and the PVCs.
  name: grafana
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  # Deleting this ApplicationSet removes the Application objects, but it leaves
  # the workloads running. Without this field, one `kubectl delete
  # applicationset appset` takes down Longhorn and every PVC with it.
  syncPolicy:
    preserveResourcesOnDeletion: true

  generators:
  - git:
      repoURL: https://github.com/D1g1talS0ul/kubernetes-apps.git
      revision: main
      directories:
      - path: apps/*
      # Shared kustomize components. This is not an app.
      - path: apps/components
        exclude: true

  template:
    metadata:
      name: '{{.path.basename}}'
    spec:
      project: platform
      source:
        repoURL: https://github.com/D1g1talS0ul/kubernetes-apps.git
        targetRevision: main
        path: '{{.path.path}}'
        helm:
          version: v3
          # Do not add `valueFiles` here. `path` is the chart root, so Helm
          # already reads that chart's own values.yaml.
          #
          # Do not add `skipSchemaValidation`. All charts render clean with
          # validation on, so a bad value must fail loudly instead of reaching
          # the cluster.
          #
          # Skip Helm test hooks. Argo CD does not run them, so the pihole and
          # Grafana chart tests have no purpose here. No stray test Pod is in
          # the cluster today. This keeps the render deterministic.
          skipTests: true
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      # Cilium rewrites `/spec/conversion` on the CRDs it owns, so Argo CD sees
      # a permanent diff. This pair keeps the apps from flapping OutOfSync.
      # https://docs.cilium.io/en/stable/configuration/argocd-issues/
      ignoreDifferences:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        jsonPointers:
        - /spec/conversion
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
        # The apps have real ordering needs. sealed-secrets must run before
        # Grafana can unseal its admin password, the prometheus-operator CRDs
        # must exist before the Longhorn ServiceMonitor applies, and the
        # Longhorn StorageClass must exist before the Prometheus PVC binds.
        # Backoff converges through those races on its own.
        #
        # RollingSync would order the apps explicitly, but it disables autosync
        # on every generated Application, which would cost prune and selfHeal.
        # Backoff is the better trade here.
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m

# Slim overlay for the kube-prometheus-stack subchart.
#
# Everything not set here uses the upstream chart defaults. Previously this
# directory vendored the full kube-prometheus-stack chart with its 5.4k-line
# values file, but with the upstream `templates/` stripped out it only ever
# rendered CRDs + kube-state-metrics + node-exporter (no operator/server). This
# thin umbrella renders the whole stack; the only intentional deviations from
# upstream defaults are captured below.
kube-prometheus-stack:
  # prometheus-operator CRDs are owned by the chart's bundled `crds` subchart.
  crds:
    enabled: true

  # Grafana runs as its own ArgoCD app (apps/grafana); don't deploy the bundled
  # one. (This was the sole customization in the old vendored values file.)
  grafana:
    enabled: false

  # Lean footprint for the 4x RPi5 (8GB) cluster: no Alertmanager for now.
  alertmanager:
    enabled: false

  prometheusOperator:
    enabled: true

  prometheus:
    enabled: true
    prometheusSpec:
      # Discover ServiceMonitors/PodMonitors/Probes/Rules regardless of their
      # `release` label. Left at the chart default (true), the chart injects a
      # selector of `release: prometheus`, which silently drops the ArgoCD
      # ServiceMonitors (labeled `release: prometheus-operator` by a prior
      # operator install) and any monitor added by hand (e.g. Longhorn) — leaving
      # those Grafana dashboards blank. Setting these false makes the chart render
      # empty selectors (`{}`), i.e. select everything across all namespaces.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      # 60-day history for Grafana trends. retentionSize caps the TSDB below
      # the volume size so the disk cannot fill if the estimate is low; the
      # first limit reached (time or size) trims the oldest blocks.
      retention: 60d
      retentionSize: 80GB
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 1500Mi
      # Persist the TSDB on Longhorn (default StorageClass, expandable).
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                # ~54 GB of blocks at 60d + compaction headroom + growth room.
                # Longhorn expands online; operator v0.93 patches the live PVC.
                storage: 100Gi

  # Already running in ns `prometheus`; keep enabled (in-place, names unchanged).
  kubeStateMetrics:
    enabled: true
  nodeExporter:
    enabled: true

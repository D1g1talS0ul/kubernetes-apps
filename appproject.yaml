apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Homelab platform apps. The `appset` ApplicationSet generates them.

  # Only this repo may be a source. An app cannot point at an arbitrary chart.
  sourceRepos:
  - https://github.com/D1g1talS0ul/kubernetes-apps.git

  # One cluster only.
  #
  # kube-system stays allowed. kube-prometheus-stack puts its control-plane
  # scrape targets there: headless Services for etcd, kube-controller-manager,
  # kube-scheduler, kube-proxy and CoreDNS. A `!kube-system` deny rule blocks
  # those five Services and leaves the prometheus app permanently OutOfSync.
  #
  # Helm and Ansible still manage Cilium and CoreDNS by hand. Nothing in this
  # repo renders them, so no app fights over them.
  destinations:
  - namespace: '*'
    server: https://kubernetes.default.svc

  # Longhorn, the prometheus-operator and Argo CD itself all install
  # cluster-scoped objects (CRDs, ClusterRoles, StorageClasses, webhooks), so
  # this stays open. The real guardrails above are the repo and the cluster.
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'

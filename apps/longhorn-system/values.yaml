# Minimal, behavior-preserving overlay for the upstream `longhorn` subchart.
#
# IMPORTANT: values MUST be nested under the `longhorn:` key so they match the
# Helm dependency name in Chart.yaml. The previous file nested everything under
# `longhorn-system:` (the app/namespace name, not the subchart name), so the
# ENTIRE block was inert and the subchart ran on pure chart defaults. That
# masked a landmine: the old file also pinned every image to `master-head`,
# which would have pulled bleeding-edge builds the instant anyone "fixed" the
# key. This rewrite keeps only the intentional deviations from chart defaults
# and lets the chart pin the correct, version-matched images.
longhorn:
  # ArgoCD-friendly: skip the pre-upgrade hook Job. As a Helm pre-upgrade hook it
  # becomes an ArgoCD PreSync hook and has hung syncs before (see README). The
  # in-manager `upgradeVersionCheck` is left at its default (true), so Longhorn's
  # own minor-skip enforcement stays active as a safety net.
  preUpgradeChecker:
    jobEnabled: false

  # Pin the default StorageClass explicitly so an upstream default change during
  # the upgrade can't silently alter it. These match the live cluster today.
  persistence:
    defaultClass: true
    defaultClassReplicaCount: 3
    reclaimPolicy: Delete

  defaultSettings:
    # Data directory chosen at the original (pre-ArgoCD) install; see README.
    # Only affects creation of NEW default disks — existing node disks are
    # untouched. Matches the live `default-data-path` setting.
    defaultDataPath: /storage01

  # Behavior-preserving override for the 1.10.2 -> 1.12.1 upgrade.
  # In 1.12 the chart defaults `networkPolicies.restrictInternalTraffic: true`,
  # which renders 6 enforced NetworkPolicies in longhorn-system (manager,
  # instance-manager, webhook, recovery-backend, backing-image-*). This
  # cluster's CNI is Cilium, which ENFORCES NetworkPolicy, and longhorn-system
  # currently has ZERO policies. The longhorn-manager policy is default-deny
  # Ingress with an allowlist of only longhorn-internal pods, so adopting it
  # blind would block Prometheus (in the `prometheus` ns) from scraping
  # longhorn-manager metrics. Keep the pre-1.12 behavior (no internal-traffic
  # restriction) so this stays a pure version bump. Adopting network policies
  # should be a separate, deliberate hardening change with the allowlist
  # extended for monitoring.
  networkPolicies:
    enabled: false
    restrictInternalTraffic: false

# Prometheus scrape targets for the Argo CD components.
#
# Every selector below matches the `app.kubernetes.io/name` label that Argo CD
# v3.5.2 install.yaml puts on the matching Service. Check the render after an
# Argo CD bump:
#   kustomize build apps/argocd | rg -B6 '^kind: Service$'
#
# These carried a `release: prometheus-operator` label before. It selected
# nothing, because apps/prometheus/values.yaml now sets the operator to select
# all ServiceMonitors. The label is gone so it cannot mislead again.
#
# A `argocd-redis-ha-haproxy` ServiceMonitor also lived here. The install is not
# HA, the Service is named `argocd-redis`, and it exposes no metrics port, so the
# ServiceMonitor matched nothing and is removed.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-metrics
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-metrics
  endpoints:
  - port: metrics
  namespaceSelector:
    matchNames:
    - argocd
---

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-gateway-grafana
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  gatewayClassName: cilium
  listeners:
  - name: https-grafana
    protocol: HTTPS
    port: 443
    hostname: "grafana.cikli.com"
    allowedRoutes:
      namespaces:
        from: Same
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: grafana-1-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cilium-route-grafana
  annotations:
    external-dns.alpha.kubernetes.io/hostname: grafana.cikli.com
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: tls-gateway-grafana
  hostnames:
  - "grafana.cikli.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: grafana
      port: 80
      weight: 1

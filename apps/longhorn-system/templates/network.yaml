apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-gateway-longhorn
  annotations:
    # Production Let's Encrypt. See apps/grafana/templates/network.yaml.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: cilium
  listeners:
  - name: https-longhorn
    protocol: HTTPS
    port: 443
    hostname: "longhorn.cikli.com"
    allowedRoutes:
      namespaces:
        from: Same
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: longhorn-1-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cilium-route-longhorn
  annotations:
    external-dns.alpha.kubernetes.io/hostname: longhorn.cikli.com
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: tls-gateway-longhorn
  hostnames:
  - "longhorn.cikli.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: longhorn-frontend
      port: 80
      weight: 1

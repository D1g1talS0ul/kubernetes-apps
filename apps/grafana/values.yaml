---
grafana:
  # -- Deploy Grafana if enabled. See [upstream readme](https://github.com/grafana/helm-charts/tree/main/charts/grafana#configuration) for full values reference.
  enabled: true
  # -- Grafana data sources config. Connects to all three by default
  datasources:
    datasources.yaml:
      apiVersion: 1
      # -- Datasources linked to the Grafana instance. Override if you disable any components.
      datasources:
        # https://grafana.com/docs/grafana/latest/datasources/prometheus/#provision-the-data-source
        - name: Prometheus
          uid: prom
          type: prometheus
          isDefault: true
          access: proxy
          editable: false
          url: http://prometheus-kube-prometheus-prometheus.prometheus.svc:9090
          version: 1
        - name: Loki
          type: loki
          url: http://loki-gateway.loki.svc
        # UniFi metrics from unpoller, stored in InfluxDB 3 on the Plex host.
        # InfluxDB 3 answers InfluxQL on its v1 /query endpoint. The v1 API
        # ignores the user and takes the database token as the password.
        # The token comes from the sealed secret below via envFromSecret.
        - name: InfluxDB-UniFi
          uid: influxdb-unpoller
          type: influxdb
          access: proxy
          editable: false
          url: http://192.168.1.14:8181
          user: unpoller
          jsonData:
            dbName: unpoller
            httpMode: GET
          secureJsonData:
            password: $INFLUXDB_UNPOLLER_TOKEN
  # Load the InfluxDB 3 token into the Grafana pod as an environment variable.
  # The datasource above reads it as $INFLUXDB_UNPOLLER_TOKEN. The secret key
  # must equal that name. See templates/sealed-secrets-influxdb-token.yaml.
  envFromSecret: influxdb-unpoller-token
  admin:
    ## Name of the secret. Can be templated.
    existingSecret: "grafana-admin-secret"
    userKey: admin-user
    passwordKey: admin-password

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard

  dashboards:
    default:
      node-exporter-full:
        gnetId: 1860
        revision: 37
        datasource: Prometheus
      node-exporter-2024:
        gnetId: 22413
        revision: 4
        datasource: Prometheus
      argoCD-operational:
        gnetId: 19993
        revision: 3  
        datasource: Prometheus
      argoCD-application:
        gnetId: 19974
        revision: 3  
        datasource: Prometheus
      coreDNS:
        gnetId: 14981
        revision: 2
        datasource: Prometheus
      longhorn:
        gnetId: 22705
        revision: 1
        datasource: Prometheus
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

loki:
  # -- Deploy Loki if enabled. See [upstream readme](https://github.com/grafana/helm-charts/tree/main/charts/loki-distributed#values) for full values reference.
  enabled: false


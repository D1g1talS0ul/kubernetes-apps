apiVersion: v2
name: prometheus
description: >-
  In-cluster monitoring: prometheus-operator + a Prometheus server, plus
  kube-state-metrics and node-exporter. Thin umbrella over the upstream
  kube-prometheus-stack chart (Grafana runs as its own app; Alertmanager is
  disabled). The chart's bundled `crds` subchart owns the prometheus-operator
  CRDs.
type: application
version: 0.1.0
appVersion: v0.93.1

dependencies:
  - name: kube-prometheus-stack
    version: 88.6.1
    repository: https://prometheus-community.github.io/helm-charts
